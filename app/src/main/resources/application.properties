spring.application.name=webshop

spring.security.user.name=user
spring.security.user.password=password

server.error.path=/error

# Swagger API documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true

# Datasource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/webshop
spring.datasource.username=webshop
spring.datasource.password=webshop

spring.datasource.initialization-mode=always
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data/category.sql,classpath:data/products.sql

spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=MyHikariPoolTest
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

### Logging ###

logging.level.root=INFO
logging.level.at.fhtw.webshop=INFO

# Security
logging.level.org.springframework.security=INFO

# JPA
#logging.level.org.hibernate=DEBUG

# Thymeleaf (debug)
spring.thymeleaf.cache=false