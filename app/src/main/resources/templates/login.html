<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <h1 class="mb-4 text-center">Login</h1>

                <form action="#" method="post">

                    <div class="mb-3">
                        <label for="usernameOrEmail" class="form-label">Benutzername oder E-Mail</label>
                        <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-control" placeholder="Benutzername oder E-Mail" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Passwort</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Passwort" required>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">Login merken</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Einloggen</button>

                </form>

            </div>
        </div>
    </div>
</main>
>
</body>
</html>
