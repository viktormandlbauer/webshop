<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt hinzufügen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2 class="mb-4">Neues Produkt hinzufügen</h2>

    <form id="product-form" onsubmit="handleProductUpload(event)" enctype="multipart/form-data">
        <!-- Name -->
        <div class="mb-3">
            <label for="productName" class="form-label">Name</label>
            <input type="text" class="form-control" id="productName" name="name" placeholder="Produktname" required>
        </div>

        <!-- Beschreibung -->
        <div class="mb-3">
            <label for="productDescription" class="form-label">Beschreibung</label>
            <textarea class="form-control" id="productDescription" name="description" rows="3"
                      placeholder="Produktbeschreibung" required></textarea>
        </div>

        <!-- Kategorie -->
        <div class="mb-3">
            <label for="productCategory" class="form-label">Kategorie</label>
            <select class="form-select" id="productCategory" name="categoryId" required>
                <option value="" selected disabled>Wählen Sie eine Kategorie</option>

            </select>
        </div>

        <!-- Bestand -->
        <div class="mb-3">
            <label for="productStock" class="form-label">Bestand</label>
            <input type="number" class="form-control" id="productStock" name="stock" min="0" step="1" required>
        </div>

        <!-- Preis -->
        <div class="mb-3">
            <label for="productPrice" class="form-label">Preis (€)</label>
            <input type="number" class="form-control" id="productPrice" name="price" min="0" step="0.01" required>
        </div>

        <!-- Produktbild -->
        <div class="mb-3">
            <label for="productImage" class="form-label">Produktbild</label>
            <input type="file" class="form-control" id="productImage" name="imageFile" accept="image/*"
                   onchange="handleFiles(this.files)">
        </div>

        <!-- Vorschau anzeigen -->
        <div class="mb-3">
            <img id="preview" class="img-fluid mt-3 border rounded" style="display: none; max-height: 300px;"
                 alt="Bildvorschau">
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Produkt hinzufügen</button>
            <p id="product-message" class="mt-3"></p>
            <a href="/" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/scripts/dropzone.js"></script>
<script src="/scripts/products.js"></script>
</body>
</html>
