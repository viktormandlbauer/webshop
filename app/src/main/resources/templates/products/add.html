<head xmlns:th="http://www.w3.org/1999/xhtml">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2>Neues Produkt hinzufuegen</h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group mb-3">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Produktname" required />
        </div>
        <br>
        <br>
        <div class="form-group mb-3">
            <label for="description">Beschreibung</label>
            <textarea class="form-control" id="description" rows="3" placeholder="Produktbeschreibung"></textarea>
        </div>
        <br>
        <div class="form-group mb-3">
            <label for="productCategory" class="form-label">Kategorie</label>
            <select class="form-select" id="productCategory" name="category" required>
                <option value="" selected disabled>Waehlen Sie eine Kategorie</option>
                <option value="action">Action</option>
                <option value="roleplay">RPGs</option>
                <option value="strategy">Strategie</option>
                <option value="simulation">Simulationen</option>
                <option value="shooter">Shooter</option>
                <option value="adventure">Adventure</option>
                <option value="jumpandrun">Jump 'n' Run</option>
                <option value="moba">MOBA</option>
                <option value="survival">Survival</option>
                <option value="openworld">Open World</option>
            </select>
        </div>
        <br>
        <div class="form-group mb-3">
            <label for="stock">Bestand</label>
            <input type="number"  class="form-control" id="stock" placeholder="0" step="1" min="0" required />
        </div>
        <br>
        <div class="form-group mb-3">
            <label for="price">Preis €</label>
            <input type="number" class="form-control" id="price" placeholder="€0.00" step="0.01" min="0" required />
        </div>
        <br>
        <div class="form-group mb-3">
                <p class="dropper">Produktbild</p>
                <input type="file" id="fileElem" name="imageFile" accept="image/*"
                       onchange="handleFiles(this.files)">
            </div>
        </div>
        <br>
        <button type="submit" class="btn btn-primary">Produkt hinzufuegen</button>

        <br>
        <button type="submit" class="btn btn-primary">Abbrechen</button>
        <br>


    </form>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src='/public/products/dropzone.js'></script>
</body>
</html>
