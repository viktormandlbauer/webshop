<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Neues Produkt')}">
    <link rel="stylesheet" href="/css/dropzone.css">
</head>

<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <div id="alert" class="alert mt-4 d-none"></div>
    <h2>Neues Produkt hinzufügen</h2>

    <form id="product-form" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input type="text" class="form-control" id="name" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Beschreibung *</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Kategorie *</label>
            <select class="form-select" id="category" required>
                <option value="" selected disabled>– Kategorie wählen –</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="stock" class="form-label">Bestand *</label>
                <input type="number" class="form-control" id="stock" min="0" step="1" required>
            </div>

            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Preis (€) *</label>
                <input type="number" class="form-control" id="price" min="0" step="0.01" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Produktbild</label>

            <div id="dropzone" class="dropzone text-center p-4 mb-2">
                <p class="m-0">
                    Bild hier hineinziehen<br>
                    <small>oder klicken &amp; Datei wählen</small>
                </p>
                <input type="file" id="imageFile" accept="image/*" class="fluid d-none">
            </div>
            <img id="preview" class="img-fluid d-none" style="max-height:200px;" alt="Vorschau">
        </div>

        <button type="submit" class="btn btn-primary">Speichern</button>
        <a href="/products/list" class="btn btn-outline-secondary ms-2">Abbrechen</a>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="/scripts/addProduct.js"></script>
<script src="/scripts/dropzone.js" defer></script>
</body>
</html>
