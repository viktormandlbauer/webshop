<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registrierung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <h2>Produkte</h2>

    <!-- Categorie -->
    <form method="get" th:action="@{/products/list}" class="mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-auto">
                <label for="category" class="col-form-label">Kategorie:</label>
            </div>
            <div class="col-auto">
                <select class="form-select" name="category" id="category">
                    <option th:value="''" th:selected="${category == null}">Alle Kategorien</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.name}"
                            th:text="${cat.name}"
                            th:selected="${cat.name == category}"></option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Filtern</button>
            </div>
        </div>
    </form>

    <!-- Products -->
    <div class="row" th:if="${products.content.size() > 0}">
        <div class="col-md-4 mb-4" th:each="product : ${products.content}">
            <div class="card h-100">
                <img th:src="${#strings.isEmpty(product.imageURL) ? '/images/ProductPlaceholder.jpg' : product.imageURL}"
                     class="card-img-top"
                     style="height: 200px; object-fit: cover;"
                     alt="Bild">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Produktname</h5>
                    <p class="card-text" th:text="${product.description}">Beschreibung</p>
                    <p class="card-text"><strong>Kategorie:</strong> <span th:text="${product.category.name}"></span>
                    </p>
                    <p class="card-text"><strong>Preis:</strong> €<span
                            th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></span></p>
                    <p class="card-text"><strong>Bewertung:</strong> <span
                            th:text="${#numbers.formatDecimal(product.avgRating, 1, 2)}"></span> / 5</p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary">Details</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${products.content.size() == 0}">
        <p class="text-muted">Keine Produkte gefunden.</p>
    </div>

    <!-- Pagination -->
    <nav th:if="${products.totalPages > 1}">
        <ul class="pagination justify-content-center mt-4">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products/list(page=${products.number - 1}, category=${category})}">Zurück</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link">
                    Seite <span th:text="${products.number + 1}"></span> von <span
                        th:text="${products.totalPages}"></span>
                </span>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products/list(page=${products.number + 1}, category=${category})}">Weiter</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
