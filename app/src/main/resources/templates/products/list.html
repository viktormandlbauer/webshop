<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Products')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <h2>Produkte</h2>

    <form id="category-form" class="mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-auto">
                <label for="category" class="col-form-label">Kategorie:</label>
            </div>

            <div class="col-auto">
                <select id="category" name="category" class="form-select">
                    <option value="">Alle Kategorien</option>
                </select>
            </div>

            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Filtern</button>
            </div>
        </div>
    </form>

    <div id="product-grid" class="row gy-4"></div>

    <div id="pagination-controls" class="d-flex justify-content-center mt-4"></div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/scripts/products.js}"></script>
</body>
</html>
