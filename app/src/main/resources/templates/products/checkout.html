<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Checkout')}"></head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2 class="mb-4">Checkout</h2>

    <div class="row">
        <!-- Warenkorb-Details -->
        <div class="col-md-12">
            <h3>Warenkorb</h3>
            <div id="cart-items">
                <!-- Produkte werden hier dynamisch eingefügt -->
            </div>
            <hr>
            <div class="cart-summary">
                <p><strong>Gesamtanzahl:</strong> <span id="total-items">0</span></p>
                <p><strong>Gesamtpreis:</strong> <span id="total-price">€0.00</span></p>
            </div>
            <div class="mt-4">
                <a href="/products" class="btn btn-secondary">Zurück zur Produktliste</a>
                <button id="checkout-button" class="btn btn-success">Bestellung abschließen</button>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/scripts/checkout.js"></script>
</body>
</html>
