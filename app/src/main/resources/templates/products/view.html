<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='Produktdetails')}">
    <!-- Font Awesome CDN for star icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4" id="productDetails" data-product-id="2">
    <h2 class="mb-4">Produktdetails</h2>

    <div class="row">
        <!-- Produktbild -->
        <div class="col-md-6">
            <img id="productImage" class="img-fluid border rounded" alt="Produktbild">
        </div>

        <!-- Produktinformationen -->
        <div class="col-md-6">
            <h3 id="productName">Produktname</h3>
            <p id="productDescription">Produktbeschreibung</p>
            <p><strong>Kategorie:</strong> <span id="productCategory">Kategorie</span></p>
            <p><strong>Preis:</strong> <span id="productPrice">0.00</span></p>
            <p><strong>Durchschnittliche Bewertung:</strong> <span id="productAvgRating">0.00</span> / 5</p>
            <p><strong>Bestand:</strong> <span id="productStock">0</span></p>
            <div class="mt-4">
                <a href="/products" class="btn btn-secondary">Zurück zur Liste</a>
                <button class="btn btn-primary" onclick="addToCart()">In den Warenkorb</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/cart :: cart}"></div>

    <!-- Review creation form with star rating, only for logged-in users -->
    <div id="reviewSection" class="mt-5" sec:authorize="isAuthenticated()">
        <h4>Bewertung abgeben</h4>
        <form id="reviewForm">
            <div class="mb-3">
                <label class="form-label d-block mb-2">Bewertung (1-5 Sterne):</label>
                <div id="starRating" class="mb-2">
                    <i class="fa-regular fa-star fa-2x star" data-value="1"></i>
                    <i class="fa-regular fa-star fa-2x star" data-value="2"></i>
                    <i class="fa-regular fa-star fa-2x star" data-value="3"></i>
                    <i class="fa-regular fa-star fa-2x star" data-value="4"></i>
                    <i class="fa-regular fa-star fa-2x star" data-value="5"></i>
                </div>
                <input type="hidden" id="reviewRating" name="rating" required>
            </div>
            <div class="mb-3">
                <label for="reviewText" class="form-label">Ihre Bewertung</label>
                <textarea id="reviewText" name="text" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">Bewertung absenden</button>
        </form>
    </div>

    <!-- Review List -->
    <div id="reviewListSection" class="mt-5">
        <h4>Bewertungen</h4>
        <div id="reviewList">
            <!-- Reviews will be injected here -->
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/scripts/viewProduct.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // STAR RATING LOGIC
        const stars = document.querySelectorAll("#starRating .star");
        const ratingInput = document.getElementById("reviewRating");

        function updateStars(rating) {
            stars.forEach((star, idx) => {
                if(idx < rating) {
                    star.classList.add("fa-solid", "text-warning");
                    star.classList.remove("fa-regular");
                } else {
                    star.classList.remove("fa-solid", "text-warning");
                    star.classList.add("fa-regular");
                }
            });
        }

        if (stars.length) {
            stars.forEach((star, idx) => {
                star.addEventListener("mouseover", () => {
                    for(let i = 0; i <= idx; i++) {
                        stars[i].classList.add("fa-solid", "text-warning");
                        stars[i].classList.remove("fa-regular");
                    }
                    for(let i = idx + 1; i < stars.length; i++) {
                        stars[i].classList.remove("fa-solid", "text-warning");
                        stars[i].classList.add("fa-regular");
                    }
                });
                star.addEventListener("mouseout", () => {
                    updateStars(Number(ratingInput.value));
                });
                star.addEventListener("click", () => {
                    ratingInput.value = star.getAttribute("data-value");
                    updateStars(Number(ratingInput.value));
                });
            });
        }

        // REVIEW FORM SUBMIT LOGIC (AJAX)
        const reviewForm = document.getElementById("reviewForm");
        if (reviewForm) {
            reviewForm.addEventListener("submit", function(e) {
                e.preventDefault();
                if (!ratingInput.value) {
                    alert("Bitte wählen Sie eine Stern-Bewertung aus.");
                    return;
                }

                const productId = document.getElementById("productDetails").getAttribute("data-product-id");
                const reviewText = document.getElementById("reviewText").value;

                fetch(`/api/products/review/add?productId=${productId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        rating: ratingInput.value,
                        review: reviewText
                    })
                })
                    .then(response => {
                        if (response.ok) {
                            alert("Vielen Dank für Ihre Bewertung!");
                            document.getElementById("reviewForm").reset();
                            updateStars(0);
                            fetchAndRenderReviews(productId); // reload reviews after submit
                        } else {
                            response.text().then(text => alert("Fehler beim Senden der Bewertung: " + text));
                        }
                    })
                    .catch(error => {
                        alert("Fehler beim Senden der Bewertung: " + error);
                    });
            });
        }

        // FETCH AND DISPLAY REVIEWS
        function renderStars(rating) {
            let html = "";
            for (let i = 1; i <= 5; i++) {
                html += `<i class="fa-star fa-1x ${i <= rating ? 'fa-solid text-warning' : 'fa-regular'}"></i>`;
            }
            return html;
        }

        function fetchAndRenderReviews(productId) {
            fetch(`/api/products/${productId}/reviews`)
                .then(response => response.json())
                .then(data => {
                    const reviewList = document.getElementById("reviewList");
                    reviewList.innerHTML = "";
                    if (data && data.data && data.data.length > 0) {
                        data.data.forEach(review => {
                            const div = document.createElement("div");
                            div.className = "card mb-2";
                            div.innerHTML = `
                            <div class="card-body py-2">
                                <div class="mb-1">${renderStars(review.rating)}</div>
                                <div>${review.review}</div>
                            </div>
                        `;
                            reviewList.appendChild(div);
                        });
                    } else {
                        reviewList.innerHTML = '<div class="text-muted">Noch keine Bewertungen vorhanden.</div>';
                    }
                });
        }

        const productId = document.getElementById("productDetails").getAttribute("data-product-id");
        fetchAndRenderReviews(productId);
    });
</script>
</body>
</html>
