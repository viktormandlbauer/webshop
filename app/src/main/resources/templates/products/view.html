<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Produktdetails')}"></head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2 class="mb-4">Produktdetails</h2>

    <div class="row">
        <!-- Produktbild -->
        <div class="col-md-6">
            <img id="productImage" class="img-fluid border rounded" alt="Produktbild">
        </div>

        <!-- Produktinformationen -->
        <div class="col-md-6">
            <h3 id="productName">Produktname</h3>
            <p id="productDescription">Produktbeschreibung</p>

            <p><strong>Kategorie:</strong> <span id="productCategory">Kategorie</span></p>
            <p><strong>Preis:</strong> <span id="productPrice">0.00</span> €</p>
            <p><strong>Durchschnittliche Bewertung:</strong> <span id="productAvgRating">0.00</span> / 5</p>
            <p><strong>Bestand:</strong> <span id="productStock">0</span></p>

            <div class="mt-4">
                <a href="/products" class="btn btn-secondary">Zurück zur Liste</a>
                <button class="btn btn-primary" onclick="addToCart()">In den Warenkorb</button>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/cart :: cart}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/scripts/viewProduct.js"></script>
</body>
</html>
