<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Produkte hinzufügen')}"></head>

<!-- Eigene Skripte -->
<script src="/scripts/dropzone.js"></script>
<script src="/scripts/products.js"></script>

<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
<link
        rel="stylesheet"
        href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css"
        type="text/css"/>

<!-- Toast CSS -->
<style>
    .toast-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #28a745;
        color: white;
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        z-index: 1055;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        display: none;
        text-align: center;
        max-width: 80%;
    }

    .toast-message.show {
        display: block;
        opacity: 1;
    }

    .toast-message.error {
        background-color: #dc3545;
    }
</style>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2 class="mb-4">Neues Produkt hinzufügen</h2>

    <form id="product-form" onsubmit="handleProductUpload(event)" enctype="multipart/form-data">
        <!-- Name -->
        <div class="mb-3">
            <label for="productName" class="form-label">Name</label>
            <input type="text" class="form-control" id="productName" name="name" placeholder="Produktname" required>
        </div>

        <!-- Beschreibung -->
        <div class="mb-3">
            <label for="productDescription" class="form-label">Beschreibung</label>
            <textarea class="form-control" id="productDescription" name="description" rows="3"
                      placeholder="Produktbeschreibung" required></textarea>
        </div>

        <!-- Kategorie -->
        <div class="mb-3">
            <label for="productCategory" class="form-label">Kategorie</label>
            <select class="form-select" id="productCategory" name="categoryId" required>
                <option value="" selected disabled>Wählen Sie eine Kategorie</option>
            </select>
        </div>

        <!-- Bestand -->
        <div class="mb-3">
            <label for="productStock" class="form-label">Bestand</label>
            <input type="number" class="form-control" id="productStock" name="stock" min="0" step="1" required>
        </div>

        <!-- Preis -->
        <div class="mb-3">
            <label for="productPrice" class="form-label">Preis (€)</label>
            <input type="number" class="form-control" id="productPrice" name="price" min="0" step="0.01" required>
        </div>

        <div class="dropzone my-dropzone"></div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">Produkt hinzufügen</button>
            <p id="product-message" class="mt-3"></p>
            <a th:href="@{/admin/products}" class="btn btn-secondary">Zurück</a>
        </div>
    </form>
</main>

<!-- Toast Element -->
<div id="toast" class="toast-message" style="display:none;"></div>

<script>
    async function handleProductUpload(event) {
        event.preventDefault();

        const form = document.getElementById('product-form');
        const formData = new FormData(form);
        const dropzone = Dropzone.forElement("div.my-dropzone");

        try {
            if (dropzone.getQueuedFiles().length === 0) {
                throw new Error("Bitte ein Bild hochladen.");
            }

            dropzone.getQueuedFiles().forEach(file => {
                formData.append("imageFile", file);
            });

            const response = await fetch('/api/admin/products/add', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Fehler beim Speichern');
            }

            showToast('Produkt erfolgreich hinzugefügt!');
            form.reset();
            dropzone.removeAllFiles();

            // Nach 3 Sekunden weiterleiten
            setTimeout(() => {
                window.location.href = "/admin/products";
            }, 3000);

        } catch (error) {
            showToast(error.message || 'Fehler beim Hochladen', true);
        }
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast-message show' + (isError ? ' error' : '');

        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.style.display = 'none', 500);
        }, 3000);

        toast.style.display = 'block';
    }

    document.addEventListener("DOMContentLoaded", () => {
        // Dropzone initialisieren
        Dropzone.autoDiscover = false;
        new Dropzone("div.my-dropzone", {
            url: "/upload-placeholder", // nicht verwendet
            autoProcessQueue: false,
            maxFiles: 1,
            acceptedFiles: "image/*",
            addRemoveLinks: true
        });
    });
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
