<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Benutzerverwaltung')}">
    <link rel="stylesheet" th:href="@{/css/tablestyle.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2>Benutzerverwaltung</h2>

    <div class="mb-3">
        <label for="pageSizeSelect" class="form-label">Anzahl pro Seite:</label>
        <select id="pageSizeSelect" class="form-select" style="width: auto; display: inline-block;">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Benutzername</th>
                <th>Email</th>
                <th>Vorname</th>
                <th>Nachname</th>
                <th>Rolle</th>
            </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </div>

    <nav>
        <ul class="pagination" id="pagination-controls"></ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    let currentPage = 0;
    let pageSize = 10;

    document.addEventListener("DOMContentLoaded", () => {
        const pageSizeSelect = document.getElementById("pageSizeSelect");
        pageSizeSelect.addEventListener("change", () => {
            pageSize = parseInt(pageSizeSelect.value);
            loadUsers(0);
        });

        loadUsers(0);
    });

    async function loadUsers(page) {
        currentPage = page;
        try {
            const response = await fetch(`/api/admin/users?page=${page}&size=${pageSize}`);
            const json = await response.json();
            const users = json.data.content;
            const pageInfo = json.data.page;

            renderUserTable(users);
            renderPagination(pageInfo);
        } catch (error) {
            console.error("Fehler beim Laden der Benutzer:", error);
            document.getElementById("user-table-body").innerHTML = `
                <tr><td colspan="5" class="text-danger">Fehler beim Laden der Benutzerdaten.</td></tr>
            `;
        }
    }

    function renderUserTable(users) {
        const tbody = document.getElementById("user-table-body");
        tbody.innerHTML = "";

        users.forEach(user => {
            const tr = document.createElement("tr");
            tr.classList.add("clickable-row");
            tr.onclick = () => {
                window.location.href = `/admin/users/view?id=${user.userId}`;
            };
            tr.innerHTML = `
                <td>${user.username}</td>
                <td>${user.email}</td>
                <td>${user.firstName}</td>
                <td>${user.lastName}</td>
                <td>${user.role}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderPagination(pageInfo) {
        const ul = document.getElementById("pagination-controls");
        ul.innerHTML = "";

        const current = pageInfo.number;
        const total = pageInfo.totalPages;

        const prevLi = document.createElement("li");
        prevLi.className = `page-item ${current === 0 ? "disabled" : ""}`;
        prevLi.innerHTML = `<a class="page-link" href="#">«</a>`;
        prevLi.onclick = () => {
            if (current > 0) loadUsers(current - 1);
        };
        ul.appendChild(prevLi);

        for (let i = 0; i < total; i++) {
            const li = document.createElement("li");
            li.className = `page-item ${i === current ? "active" : ""}`;
            li.innerHTML = `<a class="page-link" href="#">${i + 1}</a>`;
            li.onclick = () => loadUsers(i);
            ul.appendChild(li);
        }

        const nextLi = document.createElement("li");
        nextLi.className = `page-item ${current >= total - 1 ? "disabled" : ""}`;
        nextLi.innerHTML = `<a class="page-link" href="#">»</a>`;
        nextLi.onclick = () => {
            if (current < total - 1) loadUsers(current + 1);
        };
        ul.appendChild(nextLi);
    }
</script>
</body>
</html>
