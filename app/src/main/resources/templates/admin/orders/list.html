<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Bestellübersicht')}"></head>
    <link rel="stylesheet" th:href="@{/css/tablestyle.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2>Bestellübersicht</h2>

    <!-- Dropdown for selecting items per page -->
    <div class="mb-3">
        <label for="pageSizeSelect" class="form-label">Anzahl pro Seite:</label>
        <select id="pageSizeSelect" class="form-select" style="width: auto; display: inline-block;">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
    </div>

    <!-- Order table -->
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Bestellnummer</th>
                <th>Datum</th>
                <th>Gesamtbetrag</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody id="order-table-body">
            <!-- Orders will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Pagination controls -->
    <nav>
        <ul class="pagination" id="pagination-controls">
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/scripts/admin/orders.js"></script>

</body>
</html>
