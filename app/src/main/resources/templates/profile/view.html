<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Webshop - Profile')}"></head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <h1 class="text-center mb-4">Mein Konto</h1>
    <div id="profile" class="card shadow p-4">

        <!-- Benutzerdaten -->
        <div class="row mb-3">
            <div class="col-md-6">
                <p><strong>Benutzername:</strong> <span id="username"></span></p>
                <p><strong>E-Mail:</strong> <span id="email"></span></p>
                <p><strong>Anrede:</strong> <span id="salutation"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>Vorname:</strong> <span id="firstName"></span></p>
                <p><strong>Nachname:</strong> <span id="lastName"></span></p>
                <p><strong>Geburtsdatum:</strong> <span id="dateOfBirth"></span></p>
            </div>
        </div>

        <!-- Adresse -->
        <div class="row mb-3">
            <div class="col-md-6">
                <p><strong>Land:</strong> <span id="country"></span></p>
                <p><strong>Adresse:</strong> <span id="address"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>Postleitzahl:</strong> <span id="postalCode"></span></p>
                <p><strong>Stadt:</strong> <span id="city"></span></p>
            </div>
        </div>

        <!-- Zahlungsmethoden -->
        <div class="form-group mb-3">
            <label for="paymentMethods" class="form-label">Zahlungsmethode wählen:</label>
            <select id="paymentMethods" class="form-select"></select>
            <div id="paymentMethodDetails" class="mt-3">
                <p><strong>Karteninhaber:</strong> <span id="cardHolderName"></span></p>
                <p><strong>Kartennummer:</strong> <span id="cardNumber"></span></p>
                <p><strong>Ablaufdatum:</strong> <span id="expiryDate"></span></p>
                <p><strong>CVV:</strong> <span id="cvv"></span></p>
            </div>
            <div class="mt-2">
                <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#editPaymentModal">Bearbeiten</button>
                <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#editPaymentModal" onclick="clearPaymentForm()">Hinzufügen</button>
                <button class="btn btn-danger" onclick="deletePaymentMethod()">Löschen</button>
            </div>
        </div>

        <!-- Adressen -->
        <div class="form-group">
            <label for="addresses" class="form-label">Adresse wählen:</label>
            <select id="addresses" class="form-select"></select>
            <div id="addressDetails" class="mt-3">
                <p><strong>Straße:</strong> <span id="streetAddress"></span></p>
                <p><strong>Stadt:</strong> <span id="cityDetails"></span></p>
                <p><strong>Postleitzahl:</strong> <span id="postalCodeDetails"></span></p>
                <p><strong>Land:</strong> <span id="countryDetails"></span></p>
            </div>
            <div class="mt-2">
                <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#editAddressModal">Bearbeiten</button>
                <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#editAddressModal" onclick="clearAddressForm()">Hinzufügen</button>
                <button class="btn btn-danger" onclick="deleteAddress()">Löschen</button>
            </div>
        </div>

    </div>
</div>

<!-- Modal: Zahlungsmethode -->
<div class="modal fade" id="editPaymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Zahlungsmethode</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="paymentForm">
                    <input type="hidden" id="editPaymentIndex">
                    <div class="mb-3"><label class="form-label">Karteninhaber</label><input type="text" class="form-control" id="editCardHolder"></div>
                    <div class="mb-3"><label class="form-label">Kartennummer</label><input type="text" class="form-control" id="editCardNumber"></div>
                    <div class="mb-3"><label class="form-label">Ablaufdatum</label><input type="text" class="form-control" id="editExpiry"></div>
                    <div class="mb-3"><label class="form-label">CVV</label><input type="text" class="form-control" id="editCVV"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <button class="btn btn-success" onclick="savePaymentMethod()">Speichern</button>
                <button class="btn btn-success" onclick="addPaymentMethod()">Neu speichern</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Adresse -->
<div class="modal fade" id="editAddressModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Adresse</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addressForm">
                    <input type="hidden" id="editAddressIndex">
                    <div class="mb-3"><label class="form-label">Straße</label><input type="text" class="form-control" id="editStreet"></div>
                    <div class="mb-3"><label class="form-label">Stadt</label><input type="text" class="form-control" id="editCity"></div>
                    <div class="mb-3"><label class="form-label">Postleitzahl</label><input type="text" class="form-control" id="editPostal"></div>
                    <div class="mb-3"><label class="form-label">Land</label><input type="text" class="form-control" id="editCountry"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <button class="btn btn-success" onclick="saveAddress()">Speichern</button>
                <button class="btn btn-success" onclick="addAddress()">Neu speichern</button>
            </div>
        </div>
    </div>
</div>

<!-- JS-Logik (wird automatisch durch Canvas geladen) -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    let profile = {};

    function loadProfile() {
        fetch("/api/profile")
            .then(response => response.json())
            .then(data => {
                profile = data.data;

                document.getElementById("username").textContent = profile.username;
                document.getElementById("email").textContent = profile.email;
                document.getElementById("salutation").textContent = profile.salutation;
                document.getElementById("firstName").textContent = profile.firstName;
                document.getElementById("lastName").textContent = profile.lastName;
                document.getElementById("dateOfBirth").textContent = profile.dateOfBirth;
                document.getElementById("country").textContent = profile.country;
                document.getElementById("address").textContent = profile.address;
                document.getElementById("postalCode").textContent = profile.postalCode;
                document.getElementById("city").textContent = profile.city;

                const paymentSelect = document.getElementById("paymentMethods");
                paymentSelect.innerHTML = "";
                profile.paymentMethods.forEach((method, index) => {
                    const opt = document.createElement("option");
                    opt.value = index;
                    opt.textContent = `${method.cardHolderName} - ${method.cardNumber}`;
                    paymentSelect.appendChild(opt);
                });

                const addressSelect = document.getElementById("addresses");
                addressSelect.innerHTML = "";
                profile.addresses.forEach((address, index) => {
                    const opt = document.createElement("option");
                    opt.value = index;
                    opt.textContent = `${address.streetAddress}, ${address.city}`;
                    addressSelect.appendChild(opt);
                });

                paymentSelect.dispatchEvent(new Event("change"));
                addressSelect.dispatchEvent(new Event("change"));
            });
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadProfile();

        document.getElementById("paymentMethods").addEventListener("change", () => prefillPaymentForm());
        document.getElementById("addresses").addEventListener("change", () => prefillAddressForm());
    });

    function prefillPaymentForm() {
        const index = document.getElementById("paymentMethods").value;
        const selected = profile.paymentMethods[index];
        document.getElementById("cardHolderName").textContent = selected.cardHolderName;
        document.getElementById("cardNumber").textContent = selected.cardNumber;
        document.getElementById("expiryDate").textContent = selected.expiryDate;
        document.getElementById("cvv").textContent = selected.cvv;
        document.getElementById("editCardHolder").value = selected.cardHolderName;
        document.getElementById("editCardNumber").value = selected.cardNumber;
        document.getElementById("editExpiry").value = selected.expiryDate;
        document.getElementById("editCVV").value = selected.cvv;
    }

    function prefillAddressForm() {
        const index = document.getElementById("addresses").value;
        const selected = profile.addresses[index];
        document.getElementById("streetAddress").textContent = selected.streetAddress;
        document.getElementById("cityDetails").textContent = selected.city;
        document.getElementById("postalCodeDetails").textContent = selected.postalCode;
        document.getElementById("countryDetails").textContent = selected.country;
        document.getElementById("editStreet").value = selected.streetAddress;
        document.getElementById("editCity").value = selected.city;
        document.getElementById("editPostal").value = selected.postalCode;
        document.getElementById("editCountry").value = selected.country;
    }

    function validatePaymentForm() {
        return document.getElementById("editCardHolder").value &&
            document.getElementById("editCardNumber").value &&
            document.getElementById("editExpiry").value &&
            document.getElementById("editCVV").value;
    }

    function validateAddressForm() {
        return document.getElementById("editStreet").value &&
            document.getElementById("editCity").value &&
            document.getElementById("editPostal").value &&
            document.getElementById("editCountry").value;
    }

    function savePaymentMethod() {
        if (!validatePaymentForm()) return alert("Bitte alle Felder ausfüllen.");
        const index = document.getElementById("paymentMethods").value;
        const id = profile.paymentMethods[index].id;
        const method = {
            cardHolderName: document.getElementById("editCardHolder").value,
            cardNumber: document.getElementById("editCardNumber").value,
            expiryDate: document.getElementById("editExpiry").value,
            cvv: document.getElementById("editCVV").value
        };
        fetch(`/api/profile/payment-method/update?id=${id}`, {
            method: "PUT",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(method)
        }).then(loadProfile);
        bootstrap.Modal.getInstance(document.getElementById("editPaymentModal")).hide();
    }

    function addPaymentMethod() {
        if (!validatePaymentForm()) return alert("Bitte alle Felder ausfüllen.");
        const method = {
            cardHolderName: document.getElementById("editCardHolder").value,
            cardNumber: document.getElementById("editCardNumber").value,
            expiryDate: document.getElementById("editExpiry").value,
            cvv: document.getElementById("editCVV").value
        };
        fetch(`/api/profile/payment-method/add`, {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(method)
        }).then(loadProfile);
        bootstrap.Modal.getInstance(document.getElementById("editPaymentModal")).hide();
    }

    function deletePaymentMethod() {
        if (!confirm("Diese Zahlungsmethode wirklich löschen?")) return;
        const index = document.getElementById("paymentMethods").value;
        const id = profile.paymentMethods[index].id;
        fetch(`/api/profile/payment-method/delete?paymentMethodId=${id}`, {
            method: "DELETE"
        }).then(loadProfile);
    }

    function saveAddress() {
        if (!validateAddressForm()) return alert("Bitte alle Felder ausfüllen.");
        const index = document.getElementById("addresses").value;
        const id = profile.addresses[index].id;
        const address = {
            streetAddress: document.getElementById("editStreet").value,
            city: document.getElementById("editCity").value,
            postalCode: document.getElementById("editPostal").value,
            country: document.getElementById("editCountry").value
        };
        fetch(`/api/profile/address/update?id=${id}`, {
            method: "PUT",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(address)
        }).then(loadProfile);
        bootstrap.Modal.getInstance(document.getElementById("editAddressModal")).hide();
    }

    function addAddress() {
        if (!validateAddressForm()) return alert("Bitte alle Felder ausfüllen.");
        const address = {
            streetAddress: document.getElementById("editStreet").value,
            city: document.getElementById("editCity").value,
            postalCode: document.getElementById("editPostal").value,
            country: document.getElementById("editCountry").value
        };
        fetch(`/api/profile/address/add`, {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(address)
        }).then(loadProfile);
        bootstrap.Modal.getInstance(document.getElementById("editAddressModal")).hide();
    }

    function deleteAddress() {
        if (!confirm("Diese Adresse wirklich löschen?")) return;
        const index = document.getElementById("addresses").value;
        const id = profile.addresses[index].id;
        fetch(`/api/profile/address/delete?id=${id}`, {
            method: "DELETE"
        }).then(loadProfile);
    }

    function clearPaymentForm() {
        document.getElementById("editCardHolder").value = "";
        document.getElementById("editCardNumber").value = "";
        document.getElementById("editExpiry").value = "";
        document.getElementById("editCVV").value = "";
    }

    function clearAddressForm() {
        document.getElementById("editStreet").value = "";
        document.getElementById("editCity").value = "";
        document.getElementById("editPostal").value = "";
        document.getElementById("editCountry").value = "";
    }
</script>
</body>
</html>
