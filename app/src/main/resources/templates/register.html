<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registrierung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<main>
    <div class="container mt-5">
        <h1 class="mb-4">Registrierungsformular</h1>

        <form action="#" method="post">

            <fieldset class="border p-4 mb-4">
                <legend class="w-auto px-2">Persönliche Daten</legend>

                <div class="mb-3">
                    <label for="salutation" class="form-label">Anrede</label>
                    <select id="salutation" name="salutation" class="form-select" required>
                        <option value="">Bitte wählen</option>
                        <option value="herr">Herr</option>
                        <option value="frau">Frau</option>
                        <option value="divers">Divers</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="firstName" class="form-label">Vorname</label>
                    <input type="text" id="firstName" name="firstName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">Nachname</label>
                    <input type="text" id="lastName" name="lastName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Adresse</label>
                    <input type="text" id="address" name="address" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="postalCode" class="form-label">PLZ</label>
                        <input type="text" id="postalCode" name="postalCode" class="form-control" pattern="\\d{4,5}"
                               required>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="city" class="form-label">Ort</label>
                        <input type="text" id="city" name="city" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail-Adresse</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Benutzername</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Passwort</label>
                    <input type="password" id="password" name="password" class="form-control" minlength="8" required>
                </div>
            </fieldset>

            <fieldset class="border p-4 mb-4">
                <legend class="w-auto px-2">Zahlungsinformationen <small class="text-muted">(optional)</small></legend>

                <div class="mb-3">
                    <label for="cardHolder" class="form-label">Name des Karteninhabers</label>
                    <input type="text" id="cardHolder" name="cardHolder" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="cardNumber" class="form-label">Kartennummer</label>
                    <input type="text" id="cardNumber" name="cardNumber" class="form-control" pattern="\\d{13,19}">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="expirationDate" class="form-label">Ablaufdatum</label>
                        <input type="month" id="expirationDate" name="expirationDate" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="text" id="cvv" name="cvv" class="form-control" pattern="\\d{3,4}">
                    </div>
                </div>

            </fieldset>

            <button type="submit" class="btn btn-primary">Registrieren</button>

        </form>
    </div>

</main>

</body>
</html>
