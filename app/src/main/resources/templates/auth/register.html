<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Registrierung')}"></head>
<body>

<main>
    <div class="container mt-5">
        <h1 class="mb-4">Registrierungsformular</h1>
        <form id="register-form" onsubmit="handleRegister(event)">

            <fieldset class="border p-4 mb-4">
                <legend class="w-auto px-2">Persönliche Daten</legend>

                <div class="mb-3">
                    <label for="salutation" class="form-label">Anrede</label>
                    <select id="salutation" class="form-select" required>
                        <option value="">Bitte wählen</option>
                        <option value="herr">Herr</option>
                        <option value="frau">Frau</option>
                        <option value="divers">Divers</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="firstName" class="form-label">Vorname</label>
                    <input type="text" id="firstName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">Nachname</label>
                    <input type="text" id="lastName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="dateOfBirth" class="form-label">Geburtsdatum</label>
                    <input type="date" id="dateOfBirth" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="country" class="form-label">Land</label>
                    <input type="text" id="country" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Adresse</label>
                    <input type="text" id="address" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="postalCode" class="form-label">PLZ</label>
                        <input type="text" id="postalCode" class="form-control" required>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="city" class="form-label">Ort</label>
                        <input type="text" id="city" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail-Adresse</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Benutzername</label>
                    <input type="text" id="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Passwort</label>
                    <input type="password" id="password" class="form-control" required minlength="8">
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Registrieren</button>
            <p id="register-message" class="message"></p>

        </form>
    </div>
</main>
<script src="/scripts/auth.js"></script>
</body>
</html>
