<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registrierung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<main>
    <div class="container mt-5">
        <h1 class="mb-4">Registrierungsformular</h1>

        <!-- Formularbeginn: Thymeleaf anpassen -->
        <form th:action="@{/auth/register}" th:object="${registrationDto}" method="post">

            <fieldset class="border p-4 mb-4">
                <legend class="w-auto px-2">Persönliche Daten</legend>

                <div class="mb-3">
                    <label for="salutation" class="form-label">Anrede</label>
                    <select id="salutation" th:field="*{salutation}" class="form-select" required>
                        <option value="">Bitte wählen</option>
                        <option value="herr">Herr</option>
                        <option value="frau">Frau</option>
                        <option value="divers">Divers</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('salutation')}" th:errors="*{salutation}"></div>
                </div>

                <div class="mb-3">
                    <label for="firstName" class="form-label">Vorname</label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">Nachname</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Adresse</label>
                    <input type="text" id="address" th:field="*{address}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="postalCode" class="form-label">PLZ</label>
                        <input type="text" id="postalCode" th:field="*{postalCode}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="city" class="form-label">Ort</label>
                        <input type="text" id="city" th:field="*{city}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail-Adresse</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Benutzername</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Passwort</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required minlength="8">
                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Registrieren</button>

        </form>
    </div>
</main>

</body>
</html>
