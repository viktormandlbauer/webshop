<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Checkout')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <!-- Bootstrap CSS (you can move this to your head fragment if needed) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2 class="mb-4">Checkout</h2>

    <div class="row">
        <div class="col-md-12">
            <h3>Warenkorb</h3>
            <div id="cart-items"></div>
            <hr>
            <div class="cart-summary">
                <p><strong>Gesamtanzahl:</strong> <span id="total-items">0</span></p>
                <p><strong>Gesamtpreis:</strong> <span id="total-price">€0.00</span></p>
            </div>
            <div class="mt-4">
                <a th:href="@{/products}" class="btn btn-secondary">Zurück zur Produktliste</a>
                <button id="checkout-button" type="button" class="btn btn-success">Bestellung abschließen</button>
            </div>
        </div>
    </div>
</main>

<!-- Modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="checkoutForm" onsubmit="handleCheckout(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="checkoutModalLabel">Versandadresse und Zahlungsmethode</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="shippingAddress" class="form-label">Versandadresse</label>
                        <select id="shippingAddress" class="form-select" required>
                            <option value="">Bitte wählen...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="paymentMethod" class="form-label">Zahlungsmethode</label>
                        <select id="paymentMethod" class="form-select" required>
                            <option value="">Bitte wählen...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">Bestätigen</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/scripts/checkout.js"></script>
</body>
</html>
