<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Administration - Produkte')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4" id="product-container">
    <h2 class="mb-4">Produktdetails</h2>
    <div class="row">
        <!-- Produktbild -->
        <div class="col-md-6">
            <img id="productImage" class="img-fluid border rounded" alt="Produktbild">
        </div>
        <!-- Produktinformationen -->
        <div class="col-md-6">
            <h3 id="productName"></h3>
            <p id="productDescription"></p>
            <p><strong>Kategorie:</strong> <span id="productCategory"></span></p>
            <p><strong>Preis:</strong> <span id="productPrice"></span>€</p>
            <p><strong>Durchschnittliche Bewertung:</strong> <span id="productAvgRating"></span> / 5</p>
            <p><strong>Bestand:</strong> <span id="productStock"></span></p>
            <div class="mt-4">
                <a th:href="@{/admin/products}" class="btn btn-secondary">Zurück zur Liste</a>
                <button type="button" class="btn btn-dark" onclick="openEditModal()">Bearbeiten</button>
                <button class="btn btn-danger" onclick="deleteProduct()">Löschen</button>
            </div>
        </div>
    </div>
</main>

<!-- Toast Element -->
<div id="toast" class="toast-message" style="display: none;"></div>

<!-- Toast CSS -->
<style>
    .toast-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #28a745;
        color: white;
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        z-index: 1055;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        text-align: center;
        max-width: 80%;
    }

    .toast-message.show {
        display: block;
        opacity: 1;
    }

    .toast-message.error {
        background-color: #dc3545;
    }
</style>

<!-- Edit Product Modal -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editProductForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProductModalLabel">Produkt bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editProductName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="editProductName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editProductDescription" class="form-label">Beschreibung</label>
                        <textarea class="form-control" id="editProductDescription" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editProductCategory" class="form-label">Kategorie</label>
                        <select class="form-select" id="editProductCategory" required></select>
                    </div>
                    <div class="mb-3">
                        <label for="editProductPrice" class="form-label">Preis (€)</label>
                        <input type="number" class="form-control" id="editProductPrice" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="editProductStock" class="form-label">Bestand</label>
                        <input type="number" class="form-control" id="editProductStock" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">Speichern</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    let currentProductRawData = null;
    let categories = [];

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast-message show' + (isError ? ' error' : '');

        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.style.display = 'none', 500);
        }, 3000);

        toast.style.display = 'block';
    }

    function renderProductDetails(data) {
        document.getElementById('productName').textContent = data.name || '';
        document.getElementById('productDescription').textContent = data.description || '';
        document.getElementById('productCategory').textContent = (data.categoryID && data.categoryID.name) ? data.categoryID.name : '';
        document.getElementById('productPrice').textContent = data.price != null ? data.price.toFixed(2).replace('.', ',') : '';
        document.getElementById('productAvgRating').textContent = data.avgRating != null ? Number(data.avgRating).toFixed(2) : '—';
        document.getElementById('productStock').textContent = data.stock != null ? data.stock : '';
        document.getElementById('productImage').src = data.imageURL || '';
    }

    function fetchAndRenderProduct() {
        fetch('/api/admin/products/' + productId)
            .then(response => {
                if (!response.ok) throw new Error('Netzwerk-Antwort war nicht ok.');
                return response.json();
            })
            .then(responseJson => {
                if (responseJson && responseJson.data) {
                    currentProductRawData = responseJson.data;
                    renderProductDetails(responseJson.data);
                } else {
                    throw new Error('Antwort enthält keine Produktdaten.');
                }
            })
            .catch(error => {
                showToast('Fehler beim Laden der Produktdaten.', true);
                console.error('Fetch-Fehler:', error);
            });
    }

    function fetchCategories() {
        return fetch('/api/categories')
            .then(response => {
                if (!response.ok) throw new Error('Kategorien konnten nicht geladen werden.');
                return response.json();
            })
            .then(data => {
                categories = data;
                return categories;
            })
            .catch(error => {
                showToast('Fehler beim Laden der Kategorien.', true);
                console.error(error);
                return [];
            });
    }

    function populateCategorySelect(selectedCategoryId) {
        const select = document.getElementById('editProductCategory');
        select.innerHTML = '';
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.id;
            option.textContent = cat.name;
            if (cat.id === selectedCategoryId) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    async function openEditModal() {
        try {
            const [catList, productRes] = await Promise.all([
                categories.length ? Promise.resolve(categories) : fetchCategories(),
                fetch('/api/admin/products/' + productId).then(r => r.ok ? r.json() : Promise.reject('Fehler beim Produktladen'))
            ]);
            const product = productRes.data;
            currentProductRawData = product;

            populateCategorySelect(product.categoryID ? product.categoryID.id : null);
            document.getElementById('editProductName').value = product.name || '';
            document.getElementById('editProductDescription').value = product.description || '';
            document.getElementById('editProductPrice').value = product.price != null ? product.price : '';
            document.getElementById('editProductStock').value = product.stock != null ? product.stock : '';

            var editModal = new bootstrap.Modal(document.getElementById('editProductModal'));
            editModal.show();
        } catch (error) {
            showToast('Fehler beim Öffnen des Bearbeitungsdialogs.', true);
            console.error(error);
        }
    }

    document.addEventListener('DOMContentLoaded', async function () {
        fetchAndRenderProduct();
        await fetchCategories();

        document.getElementById('editProductForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const updatedProduct = {
                name: document.getElementById('editProductName').value,
                description: document.getElementById('editProductDescription').value,
                categoryId: document.getElementById('editProductCategory').value,
                price: parseFloat(document.getElementById('editProductPrice').value),
                stock: parseInt(document.getElementById('editProductStock').value)
            };

            fetch('/api/admin/products/' + productId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedProduct)
            })
                .then(response => {
                    if (response.ok) {
                        var editModalEl = document.getElementById('editProductModal');
                        var modal = bootstrap.Modal.getInstance(editModalEl);
                        modal.hide();
                        fetchAndRenderProduct();
                        showToast("Produkt erfolgreich aktualisiert.");
                    } else {
                        showToast("Fehler beim Aktualisieren des Produkts.", true);
                    }
                })
                .catch(error => {
                    console.error("Fehler:", error);
                    showToast("Ein unerwarteter Fehler ist aufgetreten.", true);
                });
        });
    });

    function deleteProduct() {
        if (confirm("Möchten Sie dieses Produkt wirklich löschen?")) {
            fetch('/api/admin/products/' + productId, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        showToast("Produkt erfolgreich gelöscht.");
                        setTimeout(() => {
                            window.location.href = '/admin/products';
                        }, 2000);
                    } else {
                        showToast("Fehler beim Löschen des Produkts.", true);
                    }
                })
                .catch(error => {
                    console.error("Fehler:", error);
                    showToast("Ein unerwarteter Fehler ist aufgetreten.", true);
                });
        }
    }
</script>
</body>
</html>
