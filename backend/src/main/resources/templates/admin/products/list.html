<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Produktverwaltung')}">
    <link rel="stylesheet" th:href="@{/css/tablestyle.css}">
    <!-- Add Font Awesome for star icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-4">
    <h2>Produktverwaltung</h2>

    <div class="mb-3">
        <label for="pageSizeSelect" class="form-label">Anzahl pro Seite:</label>
        <select id="pageSizeSelect" class="form-select" style="width: auto; display: inline-block;">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Produkt-ID</th>
                <th>Name</th>
                <th>Kategorie</th>
                <th>Preis</th>
                <th>Lagerstand</th>
                <th>Ø Bewertung</th>
            </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
        </table>
    </div>

    <nav>
        <ul class="pagination" id="pagination-controls"></ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/scripts/admin/product.js"></script>
</body>
</html>
