spring.application.name=webshop

spring.security.user.name=user
spring.security.user.password=password

server.error.path=/error

# Data
output.path.product.images=data/images/products/
output.path.receipts=data/receipts/

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Swagger API documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Datasource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/webshop
spring.datasource.username=webshop
spring.datasource.password=webshop
spring.sql.init.mode=always

spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=WebshopHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# JWT
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sbbdd
jwt.expiration=3600000

### Logging ###

logging.level.root=INFO
logging.level.at.fhtw.webshop=INFO

# Security
logging.level.org.springframework.security=INFO

# JPA
